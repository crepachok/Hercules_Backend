services:  
  hercules_psql:
    image: postgres
    container_name: hercules_psql
    volumes: 
      - hercules_psql:/var/lib/postgresql
    environment:
      - POSTGRES_USER=creepak
      - POSTGRES_DB=hercules
      - POSTGRES_PASSWORD=7856pass7856
    networks: 
      - hercules_net
    ports:
      - 5434:5432
    restart: unless-stopped

  hercules_redis:
    image: redis
    container_name: hercules_redis
    networks:
      - hercules_net
    ports:
      - 6379:6379
    restart: unless-stopped

volumes:
  hercules_psql:
    name: hercules_psql

networks:
  hercules_net:
    name: hercules_net
    driver: bridge
